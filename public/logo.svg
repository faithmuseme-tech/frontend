<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pa-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pa-gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pa-white-fade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="pa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pa-outer-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
    <clipPath id="pa-clip">
      <rect width="48" height="48" rx="13"/>
    </clipPath>
  </defs>

  <!-- Background card -->
  <g filter="url(#pa-outer-shadow)">
    <rect width="48" height="48" rx="13" fill="url(#pa-bg)"/>
  </g>

  <!-- Top shine -->
  <rect width="48" height="24" rx="13" clip-path="url(#pa-clip)" fill="white" fill-opacity="0.08"/>

  <!-- P stem -->
  <rect x="9" y="12" width="4" height="24" rx="2" fill="url(#pa-white-fade)"/>
  <!-- P bowl -->
  <path d="M13 12 h5 a6.5 6.5 0 0 1 0 13 H13" stroke="url(#pa-white-fade)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Centre dot -->
  <circle cx="24" cy="24" r="2.2" fill="url(#pa-gold)" filter="url(#pa-glow)"/>

  <!-- A strokes -->
  <path d="M28 36 L34.5 12 L41 36" stroke="url(#pa-white-fade)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- A crossbar -->
  <line x1="29.8" y1="27" x2="39.2" y2="27" stroke="url(#pa-white-fade)" stroke-width="3.2" stroke-linecap="round"/>
</svg>
