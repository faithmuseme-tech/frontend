    <meta property="og:title" content="PrimeAisle — Shop Premium Electronics" />
    <meta property="og:description" content="Your trusted destination for premium electronics in Uganda." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PrimeAisle — Shop Premium Electronics" />
    <meta name="twitter:description" content="Your trusted destination for premium electronics in Uganda." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
    <script>
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          });
          var pathname = decoded[0].slice(2);
          var query = decoded[1] ? ('?' + decoded[1].slice(2)) : '';
          window.history.replaceState(null, null, '/frontend/' + pathname + query + l.hash);
        }
      }(window.location))
    </script>
    <title>PrimeAisle — Shop Premium Electronics</title>
  </head>
