    <script>
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          });
          var path = decoded[0].slice(3);
          if (path && path[0] !== '/') path = '/' + path;
          var query = decoded[1] ? ('?' + decoded[1].slice(3)) : '';
          window.history.replaceState(null, null, '/frontend' + path + query + l.hash);
        }
      }(window.location))
