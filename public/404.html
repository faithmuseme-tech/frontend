<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var segmentCount = 1;
      var l = window.location;
      var pathParts = l.pathname.split('/');
      var base = pathParts.slice(0, 1 + segmentCount).join('/');
      var rest = pathParts.slice(1 + segmentCount).join('/');
      l.replace(
        l.protocol + '//' + l.host + base +
        '/?p=' + (rest ? '/' + rest : '/') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
